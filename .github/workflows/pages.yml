name: データ更新とGitHub Pages公開

on:
  push:
    branches:
      - main
  schedule:
    # 日本時間8:17〜18:17。混雑しやすい毎時00分を避ける。
    - cron: "17 23,0-9 * * *"
  workflow_dispatch:

env:
  NODE_OPTIONS: --use-system-ca

# 権限は各ジョブで必要な分だけ付ける
permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Node.jsを準備
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: 依存関係をインストール
        run: npm ci --omit=optional

      - name: PDF読取用ライブラリを追加
        run: npm install --no-save --package-lock=false --ignore-scripts @napi-rs/canvas@1.0.9

      - name: 取得・監査ロジックの回帰テスト
        run: node --test scripts/*test.mjs

      - name: 複数法務局から最新データを取得
        if: github.event_name != 'push'
        env:
          TOUKI_DIAGNOSTICS_DIR: .scrape-diagnostics
        run: npm run scrape

      - name: 取得失敗局の取得済みPDFを診断用に保存
        if: always() && github.event_name != 'push'
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: scrape-pdf-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: .scrape-diagnostics/*/*
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 3

      - name: 法務省電子署名一覧を取得
        if: github.event_name != 'push'
        run: npm run scrape:signature

      - name: 内閣府の祝日一覧を更新
        if: github.event_name != 'push'
        run: node scripts/update-holidays.mjs

      - name: 営業日計算を検証
        run: node --test scripts/business-days.test.mjs

      - name: 更新データをリポジトリへ保存
        if: github.event_name != 'push'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/data app/toshitena/moj-signature-data.js
          if ! git diff --quiet; then
            echo "::error::更新スクリプトがステージ対象外の追跡ファイルを変更しました。workflowのgit add対象を確認してください。"
            git status --short --untracked-files=no
            exit 1
          fi
          if git diff --cached --quiet; then
            echo "データ変更はありません"
          else
            git commit -m "data: 登記完了予定日を自動更新"
            for attempt in 1 2 3; do
              git pull --rebase origin main
              if git push origin HEAD:main; then
                break
              fi
              if [ "$attempt" -eq 3 ]; then
                exit 1
              fi
              sleep 5
            done
          fi
      - name: Prepare legacy and /agetena/ Pages output
        run: node scripts/prepare-pages.mjs


      - name: GitHub Pagesを準備
        uses: actions/configure-pages@v5

      - name: 公開ファイルをアップロード
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: GitHub Pagesへ公開
        id: deployment
        uses: actions/deploy-pages@v4

  audit:
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: 公開データの全局監査
        run: node --use-system-ca scripts/audit-data.mjs https://tools.ishimoto-legal.com/agetena/data/kanryo.json --retry
